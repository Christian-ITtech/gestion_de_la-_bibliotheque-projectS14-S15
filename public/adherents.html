<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Adhérents — Bibliothèque de quartier</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/adherents.css">
</head>
<body>

  <div class="app">

    <nav class="sidebar">
      <div class="sidebar-brand">
        <div>
            <img src="assets/logo.jpg" alt="Logo de la bibliothèque">
        </div>
      <a href="index.html" class="nav-link">Tableau de bord</a>
      <a href="livres.html" class="nav-link">Livres</a>
      <a href="auteurs.html" class="nav-link">Auteurs</a>
      <a href="adherents.html" class="nav-link active">Adhérents</a>
      <a href="emprunts.html" class="nav-link">Emprunts</a>
    </nav>

    <main class="main">

      <div class="page-header">
        <div>
          <h1>Adhérents</h1>
          <p>Liste des adhérents inscrits à la bibliothèque.</p>
        </div>
        <button id="btn-afficher-formulaire">+ Nouvel adhérent</button>
      </div>

      <div id="message" class="message"></div>

      <div id="form-card" class="card form-card">
        <h2 id="form-titre">Ajouter un adhérent</h2>
        <form id="form-adherent" class="form-grid">
          <input type="hidden" id="adherent-id">

          <div>
            <label for="nom">Nom</label>
            <input type="text" id="nom" required>
          </div>

          <div>
            <label for="contact">Contact</label>
            <input type="text" id="contact" required>
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-soumettre">Ajouter</button>
            <button type="button" id="btn-annuler" class="secondary">Annuler</button>
          </div>
        </form>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Contact</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corps-tableau">
            <tr><td colspan="3" class="text-muted">Chargement...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="historique-card" class="card historique-card">
        <div class="header-ligne">
          <h2 id="historique-titre">Historique des emprunts</h2>
          <button id="btn-fermer-historique" class="secondary">Fermer</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Livre</th>
              <th>Date d'emprunt</th>
              <th>Retour prévu</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="corps-historique">
          </tbody>
        </table>
      </div>

    </main>

  </div>

  <script src="js/api.js"></script>
  <script src="js/adherents.js"></script>
</body>
</html>
