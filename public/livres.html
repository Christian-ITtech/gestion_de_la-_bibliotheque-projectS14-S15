<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Livres — Bibliothèque de quartier</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/livres.css">
</head>
<body>

  <div class="app">

    <nav class="sidebar">
      <div class="sidebar-brand">
        <div>
            <img src="assets/logo.jpg" alt="Logo de la bibliothèque">
        </div>
      </div>
      <a href="index.html" class="nav-link">Tableau de bord</a>
      <a href="livres.html" class="nav-link active">Livres</a>
      <a href="auteurs.html" class="nav-link">Auteurs</a>
      <a href="adherents.html" class="nav-link">Adhérents</a>
      <a href="emprunts.html" class="nav-link">Emprunts</a>
    </nav>

    <main class="main">

      <div class="page-header">
        <div>
          <h1>Livres</h1>
          <p>Catalogue, disponibilité et recherche.</p>
        </div>
        <button id="btn-afficher-formulaire">+ Nouveau livre</button>
      </div>

      <div id="message" class="message"></div>

      <div id="form-card" class="card form-card">
        <h2 id="form-titre">Ajouter un livre</h2>
        <form id="form-livre" class="form-grid">
          <input type="hidden" id="livre-id">

          <div>
            <label for="titre">Titre</label>
            <input type="text" id="titre" required>
          </div>

          <div>
            <label for="auteur_id">Auteur</label>
            <select id="auteur_id" required>
              <option value="">Sélectionner un auteur</option>
            </select>
          </div>

          <div>
            <label for="annee_publication">Année de publication</label>
            <input type="number" id="annee_publication">
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-soumettre">Ajouter</button>
            <button type="button" id="btn-annuler" class="secondary">Annuler</button>
          </div>
        </form>
      </div>

      <div class="toolbar">
        <div class="search-wrapper">
          <button type="button" id="btn-rechercher" class="search-icon-btn" aria-label="Rechercher">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <input type="search" id="recherche" placeholder="Rechercher par titre ou auteur...">
        </div>
        <div class="spacer"></div>
        <span id="total-resultats" class="text-muted"></span>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Titre</th>
              <th>Auteur</th>
              <th>Année</th>
              <th>Statut</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corps-tableau">
            <tr><td colspan="5" class="text-muted">Chargement...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="pagination" class="pagination"></div>

    </main>

  </div>

  <script src="js/api.js"></script>
  <script src="js/livres.js"></script>
</body>
</html>
